{% extends "templates/web.html" %}

{% block title %}{{ title }}{% endblock %}

{% block page_content %}
<div class="track-ticket-page" style="max-width: 560px; margin: 0 auto;">
	<h2>Track Your Facilities Request</h2>
	<p class="text-muted">
		Enter your ticket ID (e.g. <code>WO-2026-00001</code>) and the email or
		phone number you used when you raised it.
	</p>

	<div class="form-group">
		<label for="ticket-id">Ticket ID</label>
		<input type="text" id="ticket-id" class="form-control" placeholder="WO-2026-00001">
	</div>
	<div class="form-group">
		<label for="ticket-contact">Email or Phone</label>
		<input type="text" id="ticket-contact" class="form-control" placeholder="you@example.com or 07XXXXXXXX">
	</div>
	<button class="btn btn-primary" id="track-btn" type="button">Track</button>

	<div id="track-result" class="panel panel-default" style="margin-top: 24px; display:none; padding: 16px;"></div>
	<div id="track-error" class="text-danger" style="margin-top: 24px; display:none;"></div>
</div>

<script>
(function () {
	function qs(name) {
		return new URLSearchParams(window.location.search).get(name) || "";
	}

	var idInput = document.getElementById("ticket-id");
	var contactInput = document.getElementById("ticket-contact");
	var resultBox = document.getElementById("track-result");
	var errorBox = document.getElementById("track-error");

	idInput.value = qs("ticket");

	function escapeHtml(value) {
		var div = document.createElement("div");
		div.textContent = value == null ? "" : String(value);
		return div.innerHTML;
	}

	function renderResult(data) {
		var rows = [
			["Status", data.status],
			["Priority", data.priority],
			["Type", data.work_order_type],
			["Raised on", data.creation],
			["Target resolution", data.sla_due_date],
			["Completed on", data.completed_on],
			["Closed on", data.closed_on],
			["Resolution notes", data.resolution_notes],
		];
		var html = "<h4>" + escapeHtml(data.name) + " &mdash; " + escapeHtml(data.subject) + "</h4>";
		rows.forEach(function (row) {
			if (row[1]) {
				html += "<p><strong>" + row[0] + ":</strong> " + escapeHtml(row[1]) + "</p>";
			}
		});
		resultBox.innerHTML = html;
		resultBox.style.display = "block";
	}

	document.getElementById("track-btn").addEventListener("click", function () {
		var ticketId = idInput.value.trim();
		var contact = contactInput.value.trim();
		resultBox.style.display = "none";
		errorBox.style.display = "none";

		fetch("/api/method/facilities_management.utils.tracking.get_ticket_status", {
			method: "POST",
			headers: {
				"Content-Type": "application/json",
				"X-Frappe-CSRF-Token": (typeof frappe !== "undefined" && frappe.csrf_token) ? frappe.csrf_token : "",
			},
			body: JSON.stringify({ ticket_id: ticketId, contact: contact }),
		})
			.then(function (r) {
				if (!r.ok) {
					throw new Error("lookup failed");
				}
				return r.json();
			})
			.then(function (body) {
				renderResult(body.message);
			})
			.catch(function () {
				errorBox.textContent =
					"We couldn't find a ticket with that ID and contact combination. Please double-check and try again.";
				errorBox.style.display = "block";
			});
	});
})();
</script>
{% endblock %}
